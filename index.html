    <script>
      (function() {
        // Defensive polyfill for browser extensions attempting to assign to window.fetch
        try {
          var _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            }
          });
        } catch (_) {}

        // Suppress external browser extension injection errors from breaking execution
        window.addEventListener('error', function(event) {
          if (
            event &&
            event.filename &&
            (event.filename.indexOf('chrome-extension://') !== -1 ||
             event.filename.indexOf('moz-extension://') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
